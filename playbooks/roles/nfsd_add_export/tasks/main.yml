---
- name: Add a local logical volume for the new export
  ansible.builtin.include_tasks:
    file: storage/local.yml
  when:
    - nfsd_export_storage_local | bool
    - nfsd_add_export_fstype != "tmpfs"

- name: Add an iSCSI LUN for the new export
  ansible.builtin.include_tasks:
    file: storage/iscsi.yml
  when:
    - nfsd_export_storage_iscsi | bool
    - nfsd_add_export_fstype != "tmpfs"

- name: Add a tmpfs for the new export
  ansible.builtin.include_tasks:
    file: storage/tmpfs.yml
  when:
    - nfsd_add_export_fstype == "tmpfs"

- name: Ensure {{ nfsd_add_export_volname }} has correct permissions
  become: true
  become_flags: "su - -c"
  become_method: sudo
  delegate_to: "{{ nfsd_add_export_server_host }}"
  ansible.builtin.file:
    state: directory
    path: "{{ nfsd_export_path }}/{{ nfsd_add_export_volname }}"
    owner: "{{ nfsd_add_export_user }}"
    group: "{{ nfsd_add_export_group }}"
    mode: "{{ nfsd_add_export_mode }}"

- name: Test whether SELinux is enabled
  ansible.builtin.command: /usr/sbin/selinuxenabled
  register: selinux_status
  delegate_to: "{{ nfsd_add_export_server_host }}"
  changed_when: false
  failed_when: false

- name: Fix SELinux file context under new mount
  become: true
  become_flags: "su - -c"
  become_method: sudo
  delegate_to: "{{ nfsd_add_export_server_host }}"
  ansible.builtin.command: /usr/sbin/restorecon -R "{{ nfsd_export_path }}/{{ nfsd_add_export_volname }}"
  when: selinux_status.rc == 0

- name: Ensure /etc/exports.d exists
  become: true
  become_flags: "su - -c"
  become_method: sudo
  delegate_to: "{{ nfsd_add_export_server_host }}"
  ansible.builtin.file:
    state: directory
    path: "/etc/exports.d"
    owner: "root"
    group: "root"
    mode: "644"

- name: Copy export options to a template variable
  ansible.builtin.set_fact:
    template_export_options: "{{ nfsd_add_export_options }}"

- name: Check for an fsid= export option
  ansible.builtin.set_fact:
    fsid_is_present: '{{ "fsid=" in nfsd_add_export_options }}'
  when:
    - nfsd_add_export_fstype == "tmpfs"

- name: Generate a unique fsid
  ansible.builtin.command: "uuidgen -r"
  register: export_fsid
  when:
    - nfsd_add_export_fstype == "tmpfs"
    - not fsid_is_present | bool

- name: Add an fsid= export option
  ansible.builtin.set_fact:
    template_export_options: "{{ nfsd_add_export_options }},fsid={{ export_fsid.stdout }}"
  when:
    - nfsd_add_export_fstype == "tmpfs"
    - not fsid_is_present | bool

- name: Enable pNFS for the new export
  ansible.builtin.set_fact:
    template_export_options: "{{ nfsd_add_export_options }},pnfs"
  when:
    - nfsd_add_export_pnfs | bool

- name: Create an exports.d file for the new fs
  become: true
  become_flags: "su - -c"
  become_method: sudo
  delegate_to: "{{ nfsd_add_export_server_host }}"
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports.d/{{ nfsd_add_export_volname }}.exports
    owner: root
    group: root
    mode: "0644"

- name: Reload the exports table
  become: true
  become_flags: "su - -c"
  become_method: sudo
  delegate_to: "{{ nfsd_add_export_server_host }}"
  ansible.builtin.command: /usr/sbin/exportfs -ra
