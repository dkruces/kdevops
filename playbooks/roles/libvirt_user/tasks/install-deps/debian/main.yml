---
- name: Update apt cache
  become: true
  become_method: sudo
  ansible.builtin.apt:
    update_cache: true
  tags: install

- name: Set QEMU system package based on architecture
  set_fact:
    qemu_system_package: >-
      {{
        'qemu-system-arm' if (ansible_architecture == 'aarch64' or target_arch_arm64|default(false)|bool)
        else 'qemu-system-x86'
      }}

- name: Install libvirt / kvm dependencies
  become: true
  become_method: sudo
  ansible.builtin.apt:
    name:
      - libvirt-daemon
      - libvirt-daemon-system
      - libvirt-daemon-config-network
      - libvirt-clients
      - qemu-kvm
      - "{{ qemu_system_package }}"
      - qemu-utils
    state: present
  tags: install

- name: Enable libvirtd
  become: true
  become_method: sudo
  ansible.builtin.systemd:
    name: libvirtd
    enabled: true
    masked: false

- name: Make sure libvirtd is running
  become: true
  become_method: sudo
  ansible.builtin.systemd:
    state: started
    name: libvirtd
