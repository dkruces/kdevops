---
# guestfs/host_setup/verify — non-sudo precheck for the one-time
# controller-side configuration the host_setup/setup path would
# perform. Fails with an actionable diagnostic naming the opt-in
# Make target and the doc page.

- name: Stat the libvirt storage pool directory
  ansible.builtin.stat:
    path: "{{ libvirt_storage_pool_path }}"
  register: guestfs_host_pool_stat

- name: Check the controller user's effective groups
  ansible.builtin.command: id -nG
  changed_when: false
  register: guestfs_host_user_groups

- name: Check libvirt is installed (virsh binary)
  ansible.builtin.shell: |
    set -o pipefail
    command -v virsh
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false
  register: guestfs_host_virsh

- name: Check libguestfs is installed (virt-builder binary)
  ansible.builtin.shell: |
    set -o pipefail
    command -v virt-builder
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false
  register: guestfs_host_virt_builder

- name: Fail with actionable diagnostic when libvirt is not installed
  ansible.builtin.fail:
    msg: |
      libvirt is not installed on the controller: the `virsh` binary
      is not on PATH.

      Two ways to fix this:
        1. Run the opt-in sudo target:
               make guestfs-host-setup
        2. Install libvirt and libguestfs manually following
           docs/guestfs-host_setup.md, then re-run the original
           make target.
  when: guestfs_host_virsh.rc != 0

- name: Fail with actionable diagnostic when libguestfs is not installed
  ansible.builtin.fail:
    msg: |
      libguestfs is not installed on the controller: the `virt-builder`
      binary is not on PATH.

      Two ways to fix this:
        1. Run the opt-in sudo target:
               make guestfs-host-setup
        2. Install libguestfs manually following
           docs/guestfs-host_setup.md, then re-run the original
           make target.
  when: guestfs_host_virt_builder.rc != 0

- name: Fail with actionable diagnostic when storage pool dir is missing
  ansible.builtin.fail:
    msg: |
      The libvirt storage pool directory {{ libvirt_storage_pool_path }}
      does not exist on the controller. Guest bringup will fail
      because there is nowhere to place domain disks.

      Two ways to fix this:
        1. Run the opt-in sudo target:
               make guestfs-host-setup
        2. Create the directory manually following
           docs/guestfs-host_setup.md, then re-run the original
           make target.
  when: not guestfs_host_pool_stat.stat.exists

- name: Fail with actionable diagnostic when storage pool dir has wrong group
  ansible.builtin.fail:
    msg: |
      The libvirt storage pool directory {{ libvirt_storage_pool_path }}
      is owned by group `{{ guestfs_host_pool_stat.stat.gr_name }}`,
      not `{{ libvirt_qemu_group }}`. libvirt cannot write domain
      disks there without sudo.

      Two ways to fix this:
        1. Run the opt-in sudo target:
               make guestfs-host-setup
        2. Adjust ownership manually following
           docs/guestfs-host_setup.md, then re-run the original
           make target.
  when:
    - libvirt_uri_system | default(false) | bool
    - guestfs_host_pool_stat.stat.exists
    - guestfs_host_pool_stat.stat.gr_name != libvirt_qemu_group

- name: Fail with actionable diagnostic when libvirt group membership is missing
  ansible.builtin.fail:
    msg: |
      The controller user is not a member of the {{ libvirt_qemu_group }}
      group. Bringup tasks that talk to libvirt as the regular user
      will fail.

      Two ways to fix this:
        1. Run the opt-in sudo target:
               make libvirt-user-setup
        2. Add yourself to the group manually following
           docs/libvirt-user.md, then log out and back in.
  when:
    - libvirt_uri_system | default(false) | bool
    - libvirt_qemu_group not in guestfs_host_user_groups.stdout.split()
