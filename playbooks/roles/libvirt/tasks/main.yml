---
# Orchestrator for the libvirt module's sub-roles.
#
# Default (no --tags) execution runs only the non-sudo verify paths.
# The sudo opt-in setup paths are tagged with `never` plus a per-sub
# tag and are reached only via the dedicated Make targets:
#
#   make libvirt-user-setup
#   make libvirt-storage-pool-setup
#   make libvirt-pcie-passthrough-setup
#
# Sub-role include_role lines are added in subsequent phases as each
# sub-role lands; this stub keeps the orchestrator parseable in the
# meantime.

- name: Import optional extra_args file
  ansible.builtin.include_vars: "{{ item }}"
  failed_when: false
  with_first_found:
    - files:
        - "../extra_vars.yml"
        - "../extra_vars.yaml"
        - "../extra_vars.json"
      skip: true
  tags: [always]

- name: Verify libvirt user / group membership (non-sudo precheck)
  ansible.builtin.include_role:
    name: libvirt/user/verify

- name: Libvirt user/group sudo opt-in (only with --tags libvirt_user_setup)
  ansible.builtin.include_role:
    name: libvirt/user/setup
    apply:
      tags: [libvirt_user_setup]
  tags: [never, libvirt_user_setup]

- name: Verify libvirt storage pool exists (non-sudo precheck)
  ansible.builtin.include_role:
    name: libvirt/storage_pool/verify

- name: Libvirt storage_pool sudo opt-in (only with --tags libvirt_storage_pool_setup)
  ansible.builtin.include_role:
    name: libvirt/storage_pool/setup
    apply:
      tags: [libvirt_storage_pool_setup]
  tags: [never, libvirt_storage_pool_setup]

- name: Verify libvirt PCIe passthrough sysfs ownership (non-sudo precheck)
  ansible.builtin.include_role:
    name: libvirt/pcie_passthrough/verify

- name: Libvirt pcie_passthrough sudo opt-in (only with --tags libvirt_pcie_passthrough_setup)
  ansible.builtin.include_role:
    name: libvirt/pcie_passthrough/setup
    apply:
      tags: [libvirt_pcie_passthrough_setup]
  tags: [never, libvirt_pcie_passthrough_setup]
