---
- name: Verify guestfs runtime dependencies are installed (non-sudo precheck)
  ansible.builtin.include_role:
    name: guestfs/runtime_deps/verify

- name: Guestfs runtime_deps sudo opt-in (only with --tags guestfs_runtime_deps_setup)
  ansible.builtin.include_role:
    name: guestfs/runtime_deps/setup
    apply:
      tags: [guestfs_runtime_deps_setup]
  tags: [never, guestfs_runtime_deps_setup]

- name: Verify guestfs libvirt default network is up (non-sudo precheck)
  ansible.builtin.include_role:
    name: guestfs/network/verify

- name: Guestfs network sudo opt-in (only with --tags guestfs_network_setup)
  ansible.builtin.include_role:
    name: guestfs/network/setup
    apply:
      tags: [guestfs_network_setup]
  tags: [never, guestfs_network_setup]

- name: Set the pathname of storage pool directory
  tags:
    - base_image
    - bringup
  ansible.builtin.set_fact:
    guestfs_storagedir: "{{ kdevops_storage_pool_path }}/guestfs"
  delegate_to: localhost

- name: Set the pathname of the base image in base_images directory
  tags:
    - base_image
    - bringup
  ansible.builtin.set_fact:
    guestfs_base_image: "{{ guestfs_storagedir }}/base_images/{{ virtbuilder_os_version }}.raw"
  delegate_to: localhost

- name: Ensure the required base OS image exists
  tags:
    - base_image
  ansible.builtin.import_role:
    name: base_image
  vars:
    base_image_os_version: "{{ virtbuilder_os_version }}"
    base_image_pathname: "{{ guestfs_base_image }}"
  delegate_to: localhost

- name: Bring up each target node
  tags:
    - bringup
  ansible.builtin.import_tasks:
    file: "{{ role_path }}/tasks/bringup/main.yml"
  delegate_to: localhost

- name: Set up target node console permissions
  tags:
    - console
  ansible.builtin.import_tasks:
    file: "{{ role_path }}/tasks/bringup/console-permissions.yml"
  when:
    - libvirt_uri_system|bool
  delegate_to: localhost

- name: Shut down and destroy each target node
  tags:
    - destroy
  ansible.builtin.import_tasks:
    file: "{{ role_path }}/tasks/destroy.yml"
  delegate_to: localhost

- name: Status VM tasks
  tags:
    - status
  ansible.builtin.import_tasks:
    file: "{{ role_path }}/tasks/status/main.yml"
  delegate_to: localhost
