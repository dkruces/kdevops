# Role-private defaults only. Tree-wide vars (blktests_git,
# blktests_data, blktests_data_target, blktests_test_devs,
# blktests_dbench_git, nbd_git, nbd_version, nbd_data) come from
# extra_vars.yaml via the Kconfig output yaml path. Runtime
# overrides (kdevops_run_blktests, oscheck_extra_args,
# limit_tests, run_tests_on_failures, blktests_skip_run) come from
# Make's --extra-vars at runtime; consumers reference them with
# `| default(false)` where the gap case applies.
