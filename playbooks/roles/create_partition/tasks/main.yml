---
- name: Import optional extra_args file
  ansible.builtin.include_vars: "{{ item }}"
  ignore_errors: true
  with_first_found:
    - files:
        - "../extra_vars.yml"
        - "../extra_vars.yaml"
        - "../extra_vars.json"
      skip: true
  tags: vars

# Distro specific
- name: Include install_deps task
  ansible.builtin.import_tasks: install_deps/main.yml
- name: Check if {{ create_partition_disk_path }} is mounted
  become: true
  become_method: sudo
  ansible.builtin.command: mountpoint -q {{ create_partition_disk_path }}
  register: mountpoint_stat
  failed_when: false
  changed_when: false
  tags: ["partition"]

- name: Check if {{ create_partition_disk_path }} is present on /etc/fstab
  become: true
  become_method: sudo
  ansible.builtin.shell: |
    set -o pipefail
    awk '{print $2}' /etc/fstab  | grep -q ^"{{ create_partition_disk_path }}"
  register: fstab_grep_stat
  failed_when: false
  changed_when: false
  args:
    executable: /bin/bash
  tags: ["partition"]

- name: Partitions | Read all partitions labels and see if they match {{ create_partition_disk_label }}
  become: true
  become_method: sudo
  ansible.builtin.shell: |
    set -o pipefail
    lsblk -npr -oLABEL | grep -q ^"{{ create_partition_disk_label }}"
  register: label_grep
  failed_when: false
  changed_when: false
  args:
    executable: /bin/bash
  tags: ["partition"]

- name: Partitions | Check if block {{ create_partition_disk_device }} exists
  ansible.builtin.stat:
    path: "{{ create_partition_disk_device }}"
    follow: true
  register: stat_result
  when: >
    mountpoint_stat.rc != 0 and
    fstab_grep_stat.rc != 0 and
    label_grep.rc != 0
  tags: ["partition"]

- name: Wipe old filesystem if {{ create_partition_disk_device }} was not on /etc/fstab
  become: true
  become_flags: "su - -c"
  become_method: sudo
  community.general.filesystem:
    state: absent
    fstype: "{{ create_partition_disk_fstype }}"
    dev: "{{ create_partition_disk_device }}"
    opts: "{{ create_partition_disk_fs_opts }}"
  when: >
    fstab_grep_stat.rc != 0 and
    (mountpoint_stat.rc != 0 and
     label_grep.rc != 0)
  register: create_data_fs
  tags: ["partition"]

- name: Partitions | Read {{ create_partition_disk_device }} partitions and mountpoints
  ansible.builtin.shell: |
    set -o pipefail
    lsblk -npr -oNAME,MOUNTPOINT {{ create_partition_disk_device }}
  register: result
  when: >
    stat_result is success and
    stat_result.stat is defined and
    stat_result.stat.isblk is defined and
    stat_result.stat.isblk
  args:
    executable: /bin/bash
  tags: ["partition"]

- name: Partitions | Collect partition information onto part_mounts
  ansible.builtin.set_fact:
    part_mounts: "{{ result.stdout_lines | map('split') | list }}"
  when: >
    result is success and
    result.stdout_lines is defined
  tags: ["partition"]

- name: Create filesystem if {{ create_partition_disk_device }} has no partitions and is not mounted
  become: true
  become_flags: "su - -c"
  become_method: sudo
  community.general.filesystem:
    fstype: "{{ create_partition_disk_fstype }}"
    dev: "{{ create_partition_disk_device }}"
    opts: "{{ create_partition_disk_fs_opts }}"
  environment: "{{ create_partition_disk_env }}"
  when: >
    (mountpoint_stat.rc != 0 and
     label_grep.rc != 0) and
    ((result is success and
     part_mounts_item is not defined) or
     (result is success and
     part_mounts_item is defined and
     (part_mounts_item | length == 0) or
     (part_mounts_item[0] is not defined and
     part_mounts_item[1] is not defined)))
  register: create_data_fs
  tags: ["partition"]

- name: Mount data filesystem if {{ create_partition_disk_path }} is not mounted
  become: true
  become_flags: "su - -c"
  become_method: sudo
  ansible.posix.mount:
    path: "{{ create_partition_disk_path }}"
    src: LABEL="{{ create_partition_disk_label }}"
    fstype: "{{ create_partition_disk_fstype }}"
    opts: "{{ create_partition_disk_mount_opts }}"
    state: mounted
  when: >
    mountpoint_stat.rc != 0 and
    (label_grep.rc == 0 or
     (create_data_fs is success and
      part_mounts_item is not defined) or
     (create_data_fs is success and
     part_mounts_item is defined and
     part_mounts_item | length <= 1 or
     part_mounts_item[1] is not defined) or
     (part_mounts_item is not defined) or
     (part_mounts_item is defined and
     part_mounts_item | length <= 0) or
     (part_mounts_item is defined and
     part_mounts_item | length <= 1 or
     part_mounts_item[1] is not defined))
  tags: ["partition"]

- name: Ensure directory {{ create_partition_disk_path }} is created and with correct permissions
  become: true
  become_method: sudo
  ansible.builtin.file:
    state: directory
    path: "{{ create_partition_disk_path }}"
    owner: "{{ create_partition_disk_user }}"
    group: "{{ create_partition_disk_group }}"
    mode: "{{ create_partition_disk_mode }}"
  tags: ["partition"]
