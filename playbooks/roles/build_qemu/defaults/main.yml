---

qemu_build: false

# Mirrors bootlinux's controller-mode path layout (linux/,
# linux-build/, linux-destdir/ under KDEVOPS_CONTROLLER_DATA_PATH).
# Real values come from Kconfig "output yaml" which lands them
# in extra_vars under qemu_build_tree_path / qemu_build_builddir
# / qemu_build_destdir; these defaults are only consulted if the
# role is invoked outside kdevops's Make plumbing.
qemu_build_tree_path: "{{ kdevops_controller_data_path | default('/data') }}/qemu"
qemu_build_builddir: "{{ kdevops_controller_data_path | default('/data') }}/qemu-build"
qemu_build_destdir:  "{{ kdevops_controller_data_path | default('/data') }}/qemu-destdir"

qemu_git: "https://github.com/qemu/qemu.git"
qemu_version: "v7.2.0-rc4"
qemu_target: "x86_64-softmmu"
build_linux_shallow_clone: true
build_linux_clone_depth: 1
