---
# QEMU build role defaults
#
# Most QEMU configuration comes from kconfig (see kconfigs/Kconfig.libvirt):
#   - qemu_build (bool)
#   - qemu_build_git (git repo URL)
#   - qemu_build_git_data_path (clone destination)
#   - qemu_build_git_version (version/tag/branch)
#   - qemu_target (architecture: aarch64-softmmu, x86_64-softmmu, ppc64-softmmu)
#   - qemu_bin_path (installation path)
#
# These values are automatically exported via kconfig 'output yaml' directive.
# Only role-specific variables that are NOT in kconfig should be defined here.

# Forces rebuild and reinstall even if QEMU is already present
qemu_force_install_if_present: false

# Build directory (derived from qemu_build_git_data_path)
qemu_build_dir: "{{ qemu_build_git_data_path }}/build"

# Git clone options (not configurable via kconfig)
build_linux_shallow_clone: true
build_linux_clone_depth: 1
