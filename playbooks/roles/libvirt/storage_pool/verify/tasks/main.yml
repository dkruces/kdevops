---
# libvirt/storage_pool/verify — non-sudo precheck for storage pool
# existence. Fails with an actionable diagnostic when the pool is
# missing while pool creation is enabled.

- name: Skip the storage-pool precheck when pool creation is disabled
  ansible.builtin.meta: end_play
  when: not (libvirt_storage_pool_create | default(false) | bool)

- name: Check whether the storage pool exists (no sudo)
  ansible.builtin.command:
    cmd: "virsh pool-info {{ libvirt_storage_pool_name }}"
  register: libvirt_storage_pool_verify
  failed_when: false
  changed_when: false

- name: Fail with actionable diagnostic when the pool is missing
  ansible.builtin.fail:
    msg: |
      The libvirt storage pool `{{ libvirt_storage_pool_name }}` is
      not defined yet (virsh pool-info returned rc={{ libvirt_storage_pool_verify.rc }}).
      Guest bringup will fail because there is nowhere to place
      domain disks.

      Two ways to fix this:
        1. Run the opt-in sudo target:
               make libvirt-storage-pool-setup
        2. Create the pool manually following docs/libvirt-storage_pool.md,
           then re-run the original make target.
  when: libvirt_storage_pool_verify.rc != 0
