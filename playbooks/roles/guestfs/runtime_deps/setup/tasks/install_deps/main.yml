---
- name: Debian-specific setup
  ansible.builtin.import_tasks: install_deps/debian/main.yml
  when: ansible_os_family == "Debian"

- name: SuSE-specific setup
  ansible.builtin.import_tasks: install_deps/suse/main.yml
  when: ansible_os_family == "Suse"

- name: Red Hat-specific setup
  ansible.builtin.import_tasks: install_deps/redhat/main.yml
  when: ansible_os_family == "Redhat"
