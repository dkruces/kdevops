---
- name: Ensure the controller user is in the libvirt, kvm, and qemu groups
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups:
      - libvirt
      - kvm
      - qemu
    append: true
  when: not (libvirt_session | default(false) | bool)
