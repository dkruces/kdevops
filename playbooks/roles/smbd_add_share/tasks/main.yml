---
- name: Create a new LVM partition
  become: true
  become_flags: "su - -c"
  become_method: sudo
  delegate_to: "{{ smbd_add_share_server_host }}"
  community.general.lvol:
    vg: shares
    lv: "{{ smbd_add_share_volname }}"
    size: "{{ smbd_add_share_size }}"
  when:
    - smbd_add_share_fstype != "tmpfs"

- name: Format new volume for {{ smbd_add_share_fstype }}
  become: true
  become_flags: "su - -c"
  become_method: sudo
  delegate_to: "{{ smbd_add_share_server_host }}"
  community.general.filesystem:
    fstype: "{{ smbd_add_share_fstype }}"
    dev: "/dev/shares/{{ smbd_add_share_volname }}"
  when:
    - smbd_add_share_fstype != "tmpfs"

- name: Mount volume under {{ smbd_share_path }}
  become: true
  become_flags: "su - -c"
  become_method: sudo
  delegate_to: "{{ smbd_add_share_server_host }}"
  throttle: 1 # running this in parallel can clobber fstab changes
  ansible.posix.mount:
    path: "{{ smbd_share_path }}/{{ smbd_add_share_volname }}"
    src: "/dev/shares/{{ smbd_add_share_volname }}"
    fstype: "{{ smbd_add_share_fstype }}"
    state: mounted
  when:
    - smbd_add_share_fstype != "tmpfs"

- name: Mount tmpfs under {{ smbd_share_path }}
  become: true
  become_flags: "su - -c"
  become_method: sudo
  delegate_to: "{{ smbd_add_share_server_host }}"
  throttle: 1 # running this in parallel can clobber fstab changes
  ansible.posix.mount:
    path: "{{ smbd_share_path }}/{{ smbd_add_share_volname }}"
    src: "tmpfs"
    fstype: "tmpfs"
    state: mounted
  when:
    - smbd_add_share_fstype == "tmpfs"

- name: Ensure {{ smbd_add_share_volname }} has correct permissions
  become: true
  become_flags: "su - -c"
  become_method: sudo
  delegate_to: "{{ smbd_add_share_server_host }}"
  ansible.builtin.file:
    state: directory
    path: "{{ smbd_share_path }}/{{ smbd_add_share_volname }}"
    owner: "{{ smbd_add_share_user }}"
    group: "{{ smbd_add_share_group }}"
    mode: "{{ smbd_add_share_mode }}"

- name: Test whether SELinux is enabled
  ansible.builtin.command: /usr/sbin/selinuxenabled
  register: selinux_status
  delegate_to: "{{ smbd_add_share_server_host }}"
  changed_when: false
  failed_when: false

- name: Fix SELinux file context under new mount
  become: true
  become_flags: "su - -c"
  become_method: sudo
  delegate_to: "{{ smbd_add_share_server_host }}"
  ansible.builtin.command: /usr/sbin/restorecon -R "{{ smbd_share_path }}/{{ smbd_add_share_volname }}"
  when: selinux_status.rc == 0

- name: Create an SMB share for the new fs
  become: true
  become_flags: "su - -c"
  become_method: sudo
  delegate_to: "{{ smbd_add_share_server_host }}"
  throttle: 1 # running this in parallel can clobber smb.conf changes
  ansible.builtin.blockinfile:
    dest: /etc/samba/smb.conf
    block: "{{ lookup('template', 'share.j2') }}"
    marker: "; {mark} share configuration for {{ smbd_add_share_volname }}"
    marker_begin: "begin"
    marker_end: "end"
    insertafter: "EOF"

- name: Reload the smb services
  become: true
  become_flags: "su - -c"
  become_method: sudo
  delegate_to: "{{ smbd_add_share_server_host }}"
  ansible.builtin.systemd_service:
    name: smb.service
    enabled: true
    state: reloaded
