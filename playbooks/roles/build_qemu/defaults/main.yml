---
# QEMU build role defaults
#
# When used within kdevops, these values are overridden by kconfig variables
# via 'output yaml' directive (see kconfigs/Kconfig.libvirt).
#
# These defaults serve two purposes:
# 1. Allow this role to be used standalone outside of kdevops
# 2. Provide fallback values when kconfig conditionals prevent variable export
#    (e.g., if QEMU_BUILD is disabled, kconfig won't export these variables)
#
# The kconfig variables that override these (when kdevops is used):
#   QEMU_BUILD → qemu_build
#   QEMU_BUILD_GIT → qemu_build_git
#   QEMU_BUILD_GIT_DATA_PATH → qemu_build_git_data_path
#   QEMU_BUILD_GIT_VERSION → qemu_build_git_version
#   QEMU_TARGET → qemu_target
#   QEMU_BIN_PATH → qemu_bin_path

# Whether to build QEMU
qemu_build: false

# Forces rebuild and reinstall even if QEMU is already present
qemu_force_install_if_present: false

# QEMU binary path (architecture-specific in kconfig)
qemu_bin_path: "/usr/local/bin/qemu-system-x86_64"

# Git repository for QEMU source
qemu_build_git: "https://gitlab.com/qemu-project/qemu.git"

# Where to clone the QEMU git tree
qemu_build_git_data_path: "{{ data_path | default('/tmp') }}/qemu"

# QEMU version to build
qemu_build_git_version: "v10.1.0"

# Build directory (derived from qemu_build_git_data_path)
qemu_build_dir: "{{ qemu_build_git_data_path }}/build"

# QEMU target architecture to build
qemu_target: "x86_64-softmmu"

# Git clone options
build_linux_shallow_clone: true
build_linux_clone_depth: 1
