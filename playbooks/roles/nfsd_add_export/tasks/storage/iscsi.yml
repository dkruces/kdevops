---
- name: Create an iSCSI LUN for the new export
  vars:
    iscsi_add_devname: "{{ nfsd_add_export_volname }}"
    iscsi_add_size: "{{ nfsd_add_export_size }}"
  ansible.builtin.include_role:
    name: iscsi
    tasks_from: add_lun

- name: Rescan iSCSI LUNs on the NFS server
  become: true
  become_flags: "su - -c"
  become_method: ansible.builtin.sudo
  delegate_to: "{{ nfsd_add_export_server_host }}"
  community.general.open_iscsi:
    rescan: true

- name: Rescan iSCSI LUNs on the target node
  become: true
  become_flags: "su - -c"
  become_method: ansible.builtin.sudo
  community.general.open_iscsi:
    rescan: true

- name: Enumerate available SCSI devices on the NFS server
  become: true
  become_flags: "su - -c"
  become_method: ansible.builtin.sudo
  delegate_to: "{{ nfsd_add_export_server_host }}"
  ansible.builtin.command:
    cmd: "lsblk -Snp -o MODEL,NAME"
  register: lsblk_output
  changed_when: false

- name: Select the device that matches {{ nfsd_add_export_volname }}
  ansible.builtin.set_fact:
    iscsi_device: "{{ item | split() | last }}"
  loop: "{{ lsblk_output.stdout_lines }}"
  when: nfsd_add_export_volname in item

- name: Format new iSCSI LUN for {{ nfsd_add_export_fstype }}
  become: true
  become_flags: "su - -c"
  become_method: ansible.builtin.sudo
  delegate_to: "{{ nfsd_add_export_server_host }}"
  community.general.filesystem:
    fstype: "{{ nfsd_add_export_fstype }}"
    dev: "{{ iscsi_device }}"

- name: Mount iSCSI LUN under {{ nfsd_export_path }}
  become: true
  become_flags: "su - -c"
  become_method: ansible.builtin.sudo
  delegate_to: "{{ nfsd_add_export_server_host }}"
  throttle: 1 # running this in parallel can clobber fstab changes
  ansible.posix.mount:
    path: "{{ nfsd_export_path }}/{{ nfsd_add_export_volname }}"
    src: "{{ iscsi_device }}"
    fstype: "{{ nfsd_add_export_fstype }}"
    opts: "_netdev"
    state: mounted
