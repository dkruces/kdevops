---
- name: Ensure the controller user is in the libvirt, kvm, and qemu groups
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups:
      - libvirt
      - kvm
      - qemu
    append: true
  when: not (libvirt_session | default(false) | bool)

- name: Test whether SELinux is enabled
  ansible.builtin.command: /usr/sbin/selinuxenabled
  register: libvirt_user_selinux
  changed_when: false
  failed_when: false

- name: Read the SELinux context of {{ libvirt_storage_pool_path }}
  ansible.builtin.command: "/usr/bin/stat -c %C {{ libvirt_storage_pool_path }}"
  register: libvirt_user_storage_pool_ctx
  changed_when: false
  failed_when: false
  when: libvirt_user_selinux.rc == 0

- name: Apply the svirt_home_t SELinux context to {{ libvirt_storage_pool_path }}
  become: true
  community.general.sefcontext:
    target: "{{ libvirt_storage_pool_path }}(/.*)?"
    setype: svirt_home_t
    state: present
  when:
    - libvirt_user_selinux.rc == 0
    - libvirt_user_storage_pool_ctx.stdout is defined
    - "':svirt_home_t:' not in libvirt_user_storage_pool_ctx.stdout"
