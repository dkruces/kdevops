---
# guestfs/host_setup/setup — one-time controller-side preparation
# for libvirt-backed VM provisioning. Invoked via
# `make guestfs-host-setup`, never on bare `make` or `make bringup`.
# See the spec's controller-side sudo isolation rule.

- name: Install libguestfs and supporting distro packages
  ansible.builtin.include_tasks: install-deps/main.yml

- name: Ensure the libvirt storage pool directory exists with the right group
  ansible.builtin.include_tasks: storage-pool-path.yml

- name: Ensure libvirt default network and dnsmasq are configured
  ansible.builtin.include_tasks: network.yml
